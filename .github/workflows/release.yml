name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Copall ${{ github.ref_name }}
          body: See the assets below to download for your OS.
          draft: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --mac
          - platform: ubuntu-24.04
            args: --linux
          - platform: windows-2025
            args: --win
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Electron downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ matrix.platform }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ matrix.platform }}-

      - name: Build app
        run: pnpm build

      - name: Build and upload
        shell: bash
        run: |
          attempt=1
          until pnpm exec electron-builder --config electron/builder.json ${{ matrix.args }} --publish always; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 3 ]; then
              echo "electron-builder failed after 3 attempts"
              exit 1
            fi
            echo "Attempt failed, waiting 120s before retry $attempt..."
            sleep 120
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
